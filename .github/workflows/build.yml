name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Wizard 5.0 tools are not on PyPI yet: engine-tools at a fixed commit
      - name: Install DSW TDK
        env:
          ENGINE_TOOLS: git+https://github.com/ds-wizard/engine-tools@2d45273d0ce0cfaf342dbe16bea574a8460cc39e
        run: |
          pip install \
            "dsw-models @ $ENGINE_TOOLS#subdirectory=packages/dsw-models" \
            "dsw-templating @ $ENGINE_TOOLS#subdirectory=packages/dsw-templating" \
            "dsw-tdk @ $ENGINE_TOOLS#subdirectory=packages/dsw-tdk"

      - name: Verify template
        run: dsw-tdk --no-dot-env --no-config verify .

      - name: Create package
        run: dsw-tdk --no-dot-env --no-config package . -o template.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: template
          path: template.zip
